# Production: higher resource limits for all services
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi
  target:
    kind: Deployment
    name: backend

- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  target:
    kind: Deployment
    name: evaluation-engine

- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  target:
    kind: Deployment
    name: frontend
