---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-engine-config
  namespace: llmops
  labels:
    app: evaluation-engine
    app.kubernetes.io/part-of: llmops-platform
data:
  SPRING_BOOT_URL: "http://backend:8080"
  DEBUG: "false"

---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-engine
  namespace: llmops
  labels:
    app: evaluation-engine
    app.kubernetes.io/part-of: llmops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: evaluation-engine
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2;
              done
      containers:
        - name: evaluation-engine
          image: ghcr.io/ashwithpoojary98/llmops-eval-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: eval-engine-config
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/llmevalplatform
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llmops-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi        # NLP models need more memory
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3

---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: evaluation-engine
  namespace: llmops
  labels:
    app: evaluation-engine
    app.kubernetes.io/part-of: llmops-platform
spec:
  selector:
    app: evaluation-engine
  ports:
    - port: 8000
      targetPort: 8000

---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eval-engine-hpa
  namespace: llmops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
