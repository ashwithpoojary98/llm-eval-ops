# ──────────────────────────────────────────────────────────────────────────────
# Secrets — replace ALL <base64-encoded-...> values before applying.
#
# To encode:  echo -n "your-value" | base64
# To apply:   kubectl apply -f secrets.yaml -n llmops
#
# In production use Sealed Secrets, External Secrets Operator, or Vault
# instead of storing plaintext base64 here.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: llmops-secrets
  namespace: llmops
  labels:
    app.kubernetes.io/part-of: llmops-platform
type: Opaque
data:
  # PostgreSQL
  postgres-password: <base64-encoded-db-password>

  # JWT (256-bit random secret)
  jwt-secret-key: <base64-encoded-jwt-secret>

  # AES encryption key (exactly 32 chars)
  app-encryption-key: <base64-encoded-32-char-key>

  # Admin bootstrap
  admin-email: <base64-encoded-admin@example.com>
  admin-password: <base64-encoded-admin-password>

  # SMTP (optional — can be set via Admin UI)
  mail-username: <base64-encoded-smtp-username>
  mail-password: <base64-encoded-smtp-password>
