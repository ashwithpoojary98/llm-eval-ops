version: '3.8'

services:
  evaluation-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-evaluation-engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llmops_eval
      - SPRING_BOOT_URL=http://host.docker.internal:8080
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llmops-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: llmops-postgres
    environment:
      POSTGRES_DB: llmops_eval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmops-network
    restart: unless-stopped

networks:
  llmops-network:
    driver: bridge

volumes:
  postgres_data:
