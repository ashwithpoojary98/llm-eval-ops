spring:
  application:
    name: llmops-eval
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/llmevalplatform}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@example.com}
    password: ${MAIL_PASSWORD:change-me-in-production}
    from: ${MAIL_FROM:your-email@example.com}
    from-name: ${MAIL_FROM_NAME:LLMOps Platform}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret-key: ${JWT_SECRET_KEY:change-this-to-a-secure-256-bit-secret-key-in-production}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}  # 30 minutes (1800000ms)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}  # 7 days
  issuer: ${JWT_ISSUER:llmops-platform}

# Admin Bootstrap (for first-time setup)
llmops:
  app:
    base-url: ${LLMOPS_BASE_URL:http://localhost:3000}
  health:
    check-interval-ms: ${LLMOPS_HEALTH_CHECK_INTERVAL_MS:300000}    # 5 minutes default
    degraded-latency-ms: ${LLMOPS_HEALTH_DEGRADED_LATENCY_MS:3000}  # Mark DEGRADED above 3s
    retention-days: ${LLMOPS_HEALTH_RETENTION_DAYS:30}              # Purge records older than 30 days
  bootstrap:
    admin-email: ${LLMOPS_ADMIN_EMAIL:admin@example.com}
    admin-password: ${LLMOPS_ADMIN_PASSWORD:ChangeMe123!}
    org-name: ${LLMOPS_ORG_NAME:Default Organization}
    allowed-domains: ${LLMOPS_ALLOWED_DOMAINS:example.com}

# Evaluation Engine Configuration
evaluation:
  engine:
    url: ${EVALUATION_ENGINE_URL:http://localhost:8000}
    callback-url: ${EVALUATION_CALLBACK_URL:http://localhost:8080/api/evaluations/callback}
    timeout: ${EVALUATION_ENGINE_TIMEOUT:60000}
    # Shared secret for internal callback authentication — MUST be set in production
    callback-secret: ${EVALUATION_CALLBACK_SECRET:}

# Encryption Configuration
app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:change-this-to-a-32-char-key-prod}

# CORS — comma-separated list of allowed origins
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging — set to INFO in production; DEBUG only for local development
logging:
  level:
    io.github.ashwithpoojary98: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
